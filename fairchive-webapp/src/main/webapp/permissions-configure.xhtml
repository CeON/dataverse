<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:o="http://omnifaces.org/ui">

<p:dialog id="accessDialog" 
          widgetVar="accessDialog" 
          styleClass="largePopUp" 
          header="#{bundle['dataverse.permissions.accessDialog.header']}" 
          modal="true"
          closeOnEscape="true">
    <h:form id="accessDialogForm">
	    <fieldset class="form-group">
	        <legend class="control-label">#{bundle['dataverse.permissions.Q1']}</legend>
	        <p:selectOneRadio id="creatorRole" 
	                          value="#{dialog.creatorRoleIndex}" 
	                          layout="grid" 
	                          columns="1" 
	                          styleClass="col-sm-offset-1 inline-labels">
	            <f:selectItems value="#{dialog.creatorRoles}"
	                           var="role"
	                           itemValue="#{dialog.creatorRoles.indexOf(role)}"
	                           itemLabel="#{role.label}" />
	        </p:selectOneRadio>
	    </fieldset>
	
	    <fieldset class="form-group">
	        <legend class="control-label">#{bundle['dataverse.permissions.Q2']}</legend>
	        <p:selectOneRadio id="defaultRole" 
	                          value="#{dialog.defaultDatasetContributorRoleIndex}" 
	                          layout="grid" 
	                          columns="1" 
	                          styleClass="col-sm-offset-1 inline-labels">
	                          
	            <f:selectItems value="#{dialog.defaultDatasetContributorRoles}"
	                           var="role"
	                           itemValue="#{dialog.defaultDatasetContributorRoles.indexOf(role)}"
	                           itemLabel="#{role.labelWithDetails}" />              
	        </p:selectOneRadio>
	    </fieldset>
	    
	   <fieldset class="form-group">
            <legend class="control-label">#{bundle['dataverse.permissions.Q3']}</legend>
            <p:selectOneRadio id="defaultCollectionRole" 
                              value="#{dialog.defaultDataverseContributorRoleIndex}" 
                              layout="grid" 
                              columns="1" 
                              styleClass="col-sm-offset-1 inline-labels">
                              
                <f:selectItems value="#{dialog.defaultDataverseContributorRoles}"
                               var="role"
                               itemValue="#{dialog.defaultDataverseContributorRoles.indexOf(role)}"
                               itemLabel="#{role.label}" />              
            </p:selectOneRadio>
        </fieldset>
	    
	    <div class="button-block">
	        <p:commandButton id="saveButton" 
	                         value="#{bundle['saveChanges']}" 
	                         styleClass="btn btn-default"
	                         process="@form"
	                         update="#{updateTarget}"
	                         action="#{dialog.save}"
	                         oncomplete="PF('accessDialog').hide()"/>
	        <p:commandButton type="button" 
	                class="btn btn-default" 
	                onclick="PF('accessDialog').hide()" 
	                value="#{bundle.cancel}"/>
	        <p:defaultCommand target="saveButton" 
	                          scope="accessDialog" />
	    </div>
    </h:form>
</p:dialog>
</ui:composition>
